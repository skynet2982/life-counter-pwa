<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Life Counter</title>

<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#000000">

<!-- iOS standalone / home screen support -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Life Counter">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">

<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app">

  <div id="playerLayout">
    <div class="side">
      <section class="player" id="player1" data-player="1">
        <div class="historyStrip historyStrip--left" id="player1History"></div>
        <div class="lifePoints" id="player1Points">20</div>
      </section>

      <div class="separator separator--horizontal"></div>

      <section class="player player--secondary" id="player3" data-player="3">
        <div class="historyStrip historyStrip--left" id="player3History"></div>
        <div class="lifePoints" id="player3Points">20</div>
      </section>
    </div>

    <div class="separator"></div>

    <div class="side">
      <section class="player" id="player2" data-player="2">
        <div class="lifePoints" id="player2Points">20</div>
        <div class="historyStrip historyStrip--right" id="player2History"></div>
      </section>

      <div class="separator separator--horizontal"></div>

      <section class="player player--secondary" id="player4" data-player="4">
        <div class="lifePoints" id="player4Points">20</div>
        <div class="historyStrip historyStrip--right" id="player4History"></div>
      </section>
    </div>
  </div>

  <div id="differenceView"></div>

  <div id="timerView" class="hidden"></div>

  <button id="menuButton" aria-label="Menu" data-i18n="menuButton">Menu</button>

  <div id="rotateHint" data-i18n="rotateHint">Rotate your phone for a better experience &#8635;</div>

</div>

<!-- Menu action sheet -->
<div id="menuSheet" class="overlay hidden">
  <div class="sheet">
    <button id="gameModeBtn" class="sheetItem" data-i18n="gameMode">Game mode</button>
    <button id="resetGameBtn" class="sheetItem" data-i18n="resetGame">Reset game</button>
    <button id="resetLifeBtn" class="sheetItem" data-i18n="resetLifePoints">Reset life points</button>
    <button id="toggleTimerBtn" class="sheetItem" data-i18n="toggleTimer">Add/Remove timer</button>
    <button id="shareBtn" class="sheetItem" data-i18n="shareApp">Share app</button>
    <button id="menuCancelBtn" class="sheetItem cancel" data-i18n="cancel">Cancel</button>
  </div>
</div>

<!-- Reset confirmation dialog -->
<div id="resetConfirmDialog" class="overlay hidden">
  <div class="dialog">
    <p data-i18n="resetConfirmMessage">Are you sure you want to reset the game?</p>
    <div class="dialogButtons">
      <button id="resetConfirmYes" data-i18n="yes">Yes</button>
      <button id="resetConfirmNo" data-i18n="no">No</button>
    </div>
  </div>
</div>

<!-- Game mode dialog -->
<div id="gameModeDialog" class="overlay hidden">
  <div class="dialog">
    <p data-i18n="selectGameMode">Select game mode</p>
    <div class="dialogButtons">
      <button id="mode2Btn" data-i18n="twoPlayers">2 Players</button>
      <button id="mode4Btn" data-i18n="fourPlayers">4 Players</button>
    </div>
    <div class="dialogButtons">
      <button id="gameModeCancelBtn" data-i18n="cancel">Cancel</button>
    </div>
  </div>
</div>

<!-- Timer input dialog -->
<div id="timerInputDialog" class="overlay hidden">
  <div class="dialog">
    <p data-i18n="setTimerValue">Set timer value (minutes)</p>
    <input type="number" inputmode="numeric" pattern="[0-9]*" id="timerInput" min="0">
    <div class="dialogButtons">
      <button id="timerInputOk" data-i18n="ok">OK</button>
      <button id="timerInputCancel" data-i18n="cancel">Cancel</button>
    </div>
  </div>
</div>

<!-- Share QR code dialog -->
<div id="qrShareDialog" class="overlay hidden">
  <div class="dialog qrDialogContent">
    <p data-i18n="scanToOpen">Scan to open Life Counter</p>
    <div id="qrCodeContainer"></div>
    <div class="dialogButtons">
      <button id="qrCloseBtn" data-i18n="close">Close</button>
    </div>
  </div>
</div>

<!-- History entries dialog -->
<div id="historyDialog" class="overlay hidden">
  <div class="dialog historyDialogContent">
    <p data-i18n="history">History</p>
    <ul id="historyList"></ul>
    <div class="dialogButtons">
      <button id="historyCloseBtn" data-i18n="close">Close</button>
    </div>
  </div>
</div>

<script src="qrcode-lib.js"></script>
<script src="i18n.js"></script>
<script src="app.js"></script>
</body>
</html>
